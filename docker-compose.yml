services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digiorg-backend
    restart: unless-stopped
    volumes:
      - ./data:/app/data:z
      - ./config:/app/config:z
    environment:
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: digiorg-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
